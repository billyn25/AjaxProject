[build]
  publish = "."
  functions = "functions"
  command = "node --test tests/pdf-build.test.cjs tests/recents.test.cjs tests/recents-source.test.cjs && node prepare-pdf.cjs"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/explorer.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/explorer.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
