name: Compare published AjaxCalc source
on:
  push:
    branches: [fix/recientes-directo-20261015]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recientes-directo-20261015
      - name: Download public app assets and compare with original GitHub source
        shell: bash
        run: |
          git fetch --depth=1 origin 2b66b242c2eeffce24166d410722600c80320ccf
          mkdir -p audit
          git show 2b66b242c2eeffce24166d410722600c80320ccf:src/app.js > audit/original-app.js
          node <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const base='https://ajaxcalc.netlify.app/';
            const r=await fetch(base,{signal:AbortSignal.timeout(15000)});
            if(!r.ok)throw new Error('HTML HTTP '+r.status);
            const html=await r.text();
            const scripts=[...html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["']/g)].map(x=>x[1]);
            const app=scripts.find(x=>/(?:^|\/)app(?:-recents-[a-f0-9]+)?\.js(?:\?|$)/.test(x));
            if(!app)throw new Error('No app script');
            const js=await fetch(new URL(app,base),{signal:AbortSignal.timeout(15000)});
            if(!js.ok)throw new Error('JS HTTP '+js.status);
            fs.writeFileSync('audit/live-index.html',html);
            fs.writeFileSync('audit/live-app.js',await js.text());
            console.log('Published scripts:',JSON.stringify(scripts));
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
          git diff --no-index --stat audit/original-app.js audit/live-app.js || true
          git diff --no-index --unified=2 audit/original-app.js audit/live-app.js > audit/live-vs-github.diff || true
          head -180 audit/live-vs-github.diff
      - uses: actions/upload-artifact@v4
        with:
          name: ajaxcalc-public-source-audit
          path: audit/
          retention-days: 1
